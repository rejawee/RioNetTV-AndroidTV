name: Build RC4 Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-rc4-main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RC4 source
        uses: actions/checkout@v4
        with:
          ref: rc4-ui-rebuild

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build RC4 debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RioNetTV-AndroidTV-v1.0.4-RC4-UI.apk

      - name: Upload RC4 APK
        uses: actions/upload-artifact@v4
        with:
          name: RioNetTV-AndroidTV-v1.0.4-RC4-UI
          path: RioNetTV-AndroidTV-v1.0.4-RC4-UI.apk
          if-no-files-found: error
          retention-days: 14
