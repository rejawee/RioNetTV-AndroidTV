name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RioNet source
        run: tar -xzf source/rionet_source_min.tar.gz

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RioNetTV-AndroidTV-v1.0.1-Proxy-RC1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RioNetTV-AndroidTV-v1.0.1-Proxy-RC1
          path: RioNetTV-AndroidTV-v1.0.1-Proxy-RC1.apk
          if-no-files-found: error
          retention-days: 14
