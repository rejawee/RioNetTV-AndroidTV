name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RioNet source
        run: tar -xzf source/rionet_source_min.tar.gz

      - name: Apply stable API 36 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('build.gradle.kts')
          text = root.read_text()
          text, n = re.subn(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]+"\s+apply\s+false',
              'id("com.android.application") version "8.10.1" apply false',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not patch Android Gradle Plugin version')
          root.write_text(text)

          app = Path('app/build.gradle.kts')
          text = app.read_text()

          text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', text)
          text = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', text)

          text = re.sub(
              r'(?:platform|enforcedPlatform)\("androidx\.compose:compose-bom:[^"]+"\)',
              'enforcedPlatform("androidx.compose:compose-bom:2026.06.00")',
              text,
          )

          text = re.sub(
              r'androidx\.activity:activity-compose:[^"]+',
              'androidx.activity:activity-compose:1.13.0',
              text,
          )

          if 'androidx.activity:activity-ktx' not in text:
              anchor = 'implementation("androidx.activity:activity-compose:1.13.0")'
              if anchor in text:
                  text = text.replace(
                      anchor,
                      anchor + '\n    implementation("androidx.activity:activity-ktx:1.13.0")',
                  )

          if 'androidx.compose.material3:material3' not in text:
              text = text.replace(
                  'implementation("androidx.activity:activity-ktx:1.13.0")',
                  'implementation("androidx.activity:activity-ktx:1.13.0")\n    implementation("androidx.compose.material3:material3")',
              )

          # Keep Java and Kotlin on the same JVM target. The project source had
          # Java 1.8 while Kotlin compiled for 17, which Gradle rejects.
          text = re.sub(
              r'compileOptions\s*\{[^}]*\}',
              'compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
              text,
              flags=re.S,
          )
          if 'compileOptions {' not in text:
              text = text.replace(
                  'android {',
                  'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }',
                  1,
              )

          text = re.sub(
              r'kotlinOptions\s*\{[^}]*\}',
              'kotlinOptions {\n        jvmTarget = "17"\n    }',
              text,
              flags=re.S,
          )
          if 'kotlinOptions {' not in text:
              text = text.replace(
                  'android {',
                  'android {\n    kotlinOptions {\n        jvmTarget = "17"\n    }',
                  1,
              )

          app.write_text(text)

          settings = Path('app/src/main/java/com/rionet/tv/ui/screens/SettingsScreen.kt')
          if settings.exists():
              text = settings.read_text()
              text = text.replace(
                  'import androidx.tv.material3.*',
                  'import androidx.tv.material3.Button\nimport androidx.tv.material3.Text\nimport androidx.compose.material3.TextField',
              )
              settings.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify patched build configuration
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          echo "--- root build.gradle.kts ---"
          grep -n "com.android.application" build.gradle.kts
          echo "--- app/build.gradle.kts ---"
          grep -nE "compileSdk|targetSdk|compose-bom|activity-compose|activity-ktx|sourceCompatibility|targetCompatibility|jvmTarget" app/build.gradle.kts
          grep -q 'version "8.10.1"' build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'enforcedPlatform("androidx.compose:compose-bom:2026.06.00")' app/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget = "17"' app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RioNetTV-AndroidTV-v1.0.1-Proxy-RC3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RioNetTV-AndroidTV-v1.0.1-Proxy-RC3
          path: RioNetTV-AndroidTV-v1.0.1-Proxy-RC3.apk
          if-no-files-found: error
          retention-days: 14
