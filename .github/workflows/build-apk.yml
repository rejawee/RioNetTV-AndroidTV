name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract RioNet source
        run: tar -xzf source/rionet_source_min.tar.gz

      - name: Apply RC1 build compatibility fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build.gradle.kts')
          text = root.read_text()
          text = text.replace('id("com.android.application") version "8.9.2" apply false', 'id("com.android.application") version "8.10.1" apply false')
          root.write_text(text)

          app = Path('app/build.gradle.kts')
          text = app.read_text()
          text = text.replace('androidx.compose:compose-bom:2026.08.00', 'androidx.compose:compose-bom:2026.06.00')
          if 'androidx.activity:activity-ktx' not in text:
              text = text.replace('implementation("androidx.activity:activity-compose:1.13.0")', 'implementation("androidx.activity:activity-compose:1.13.0")\n    implementation("androidx.activity:activity-ktx:1.13.0")\n    implementation("androidx.compose.material3:material3")')
          app.write_text(text)

          settings = Path('app/src/main/java/com/rionet/tv/ui/screens/SettingsScreen.kt')
          text = settings.read_text()
          text = text.replace('import androidx.tv.material3.*', 'import androidx.tv.material3.Button\nimport androidx.tv.material3.Text\nimport androidx.compose.material3.TextField')
          settings.write_text(text)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify build configuration
        run: |
          java -version
          gradle --version
          grep -n "com.android.application" build.gradle.kts
          grep -n "compose-bom" app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RioNetTV-AndroidTV-v1.0.1-Proxy-RC1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RioNetTV-AndroidTV-v1.0.1-Proxy-RC1
          path: RioNetTV-AndroidTV-v1.0.1-Proxy-RC1.apk
          if-no-files-found: error
          retention-days: 14
