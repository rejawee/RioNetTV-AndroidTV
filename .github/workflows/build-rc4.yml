name: Build RC5 Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [ rc4-ui-rebuild ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-rc4.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RC5 source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build RC5 debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RioNetTV-AndroidTV-v1.0.5-RC5-Figma.apk
      - name: Upload RC5 APK
        uses: actions/upload-artifact@v4
        with:
          name: RioNetTV-AndroidTV-v1.0.5-RC5-Figma
          path: RioNetTV-AndroidTV-v1.0.5-RC5-Figma.apk
          if-no-files-found: error
          retention-days: 14
